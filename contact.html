<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo-div">
        <h1>
          <img
            class="logo-img"
            src="images/logotyp.png"
            alt="Christoffers Carshop"
          />
        </h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Start</a></li>
          <li><a href="products.html">Produkter</a></li>
          <li><a href="about.html">Om oss</a></li>
          <li><a href="contact.html">Kontakt</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Kontakta oss</h2>
      <section class="contact-section">
        <form action="" method="post">
          <fieldset>
            <legend>Kontaktformulär</legend>
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Namn..."
              required
            />
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email..."
              required
            />
            <label for="payment">Finansieringsform:</label>
            <select name="payment" id="payment">
              <option value="purchase">Köpa</option>
              <option value="lease">Leasa</option>
              <option value="rent">Hyra</option>
            </select>
            <label for="message">Meddelande:</label>
            <textarea name="message" id="message" rows="1" cols="50"></textarea>
            <button>Skicka</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <div>
        <p>Christoffers Carshop AB</p>
        <a href="mailto:CCarshopAB@bilar.se">Maila till oss</a>
        <p>&copy; All Rights Reserved</p>
        <a href="privacy.html">Integritetspolicy</a>
      </div>
    </footer>
  </body>
</html>
